name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'

      - name: Build debug APK
        run: |
          set -o pipefail
          gradle assembleDebug --stacktrace --no-daemon 2>&1 | tee build.log

      - name: Commit build log on failure
        if: failure()
        run: |
          git config user.name "ci-bot"
          git config user.email "ci-bot@users.noreply.github.com"
          {
            echo "# CI build log";
            echo "";
            echo '```';
            tail -n 300 build.log 2>/dev/null || echo "no build.log";
            echo '```';
          } > CI_LOG.md
          git add CI_LOG.md
          git commit -m "ci: build log [skip ci]" || true
          git push || true

      - name: Upload APK artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: jizhang-buddy-debug
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Publish APK to release
        if: success()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: 记账buddy build ${{ github.run_number }}
          body: |
            自动构建产物，可直接下载安装。
          files: app/build/outputs/apk/debug/app-debug.apk
